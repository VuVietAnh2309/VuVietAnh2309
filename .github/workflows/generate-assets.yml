name: Generate profile assets

# Sinh sẵn các thẻ thống kê thành SVG tĩnh trong assets/ rồi commit vào repo.
# README trỏ tới file local -> không phụ thuộc service ngoài (streak-stats, vercel...)
# nên card không bao giờ bị timeout hay chết.

on:
  schedule:
    - cron: "0 3 * * *" # 10:00 giờ VN mỗi ngày
  workflow_dispatch: # cho phép chạy tay
  push:
    branches: [main]
    paths-ignore:
      - "assets/metrics.svg"
      - "assets/snake.svg"
      - "assets/snake-dark.svg"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Thẻ tổng hợp: activity, repositories, languages, lịch contribution 3D.
      # METRICS_TOKEN (PAT, scope: read:user + repo) là TÙY CHỌN — nếu chưa tạo thì
      # tự fallback sang GITHUB_TOKEN, chỉ thiếu số liệu private contributions.
      - name: Build metrics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: VuVietAnh2309
          # output_action: none => metrics KHÔNG tự commit, chỉ ghi file ra
          # /metrics_renders/<filename> trên runner (ngoài workspace), nên phải
          # copy vào assets/ ở step sau rồi commit gộp một lần.
          filename: metrics.svg
          output_action: none
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Ho_Chi_Minh
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Fail to nếu không có file, thay vì im lặng "success" mà giữ placeholder.
      - name: Move metrics render into assets/
        run: |
          src=/metrics_renders/metrics.svg
          if [[ ! -s "$src" ]]; then
            echo "::error::Không tìm thấy metrics render tại $src"
            ls -laR /metrics_renders || true
            exit 1
          fi
          sudo cp "$src" assets/metrics.svg
          sudo chown "$(id -u):$(id -g)" assets/metrics.svg
          echo "Đã copy $(wc -c < assets/metrics.svg) bytes -> assets/metrics.svg"

      # Animation "con rắn" ăn contribution graph, 2 bản light/dark.
      - name: Build contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark

      # [skip ci] + commit bằng GITHUB_TOKEN => không tự trigger lại workflow.
      - name: Commit refreshed assets
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(assets): refresh profile cards [skip ci]"
          file_pattern: assets/metrics.svg assets/snake.svg assets/snake-dark.svg
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
